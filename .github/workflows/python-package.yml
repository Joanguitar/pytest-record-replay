name: Main CI-CD workflow

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  check-version:
    uses: ./.github/workflows/check_version.yml

  build:
    needs: check-version
    uses: ./.github/workflows/build.yml

  pypi-publish:
    needs: [test, build]
    uses: ./.github/workflows/publish.yml
    permissions:
      id-token: write