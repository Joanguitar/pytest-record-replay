[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-record-replay"
dynamic = ["version"]
description = "Record and recall behavior in pytest tests"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
keywords = ["pytest", "testing", "recording", "replay", "mocking"]
classifiers = [
    "Framework :: Pytest",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=7,<9; python_version < '3.10'",
    "pytest>=7; python_version >= '3.10'",
    "dill>=0.3.8",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
test = ["pytest-cov>=4"]

[project.urls]
Homepage = "https://github.com/Joanguitar/pytest-record-replay"
Repository = "https://github.com/Joanguitar/pytest-record-replay"
Issues = "https://github.com/Joanguitar/pytest-record-replay/issues"

[project.entry-points.pytest11]
"pytest_record_replay.pytest_plugin" = "pytest_record_replay.pytest_plugin"

[tool.setuptools.dynamic]
version = { attr = "pytest_record_replay.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=pytest_record_replay",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:coverage",
]

[tool.coverage.run]
omit = [
    "src/pytest_record_replay/__init__.py",
    "src/pytest_record_replay/pytest_plugin.py",
]