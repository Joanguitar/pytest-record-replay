[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nopatch"
version = "0.0.1"
description = "Record and recall behavior in pytest tests"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["pytest>=7"]

[project.entry-points.pytest11]
"nopatch.pytest_plugin" = "nopatch.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]