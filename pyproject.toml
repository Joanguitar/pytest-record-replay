[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nopatch"
version = "0.0.1"
description = "Record and recall behavior in pytest tests"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "pytest>=7,<9; python_version < '3.10'",
    "pytest>=7; python_version >= '3.10'",
    "dill>=0.3.8",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
test = ["pytest-cov>=4"]

[project.entry-points.pytest11]
"nopatch.pytest_plugin" = "nopatch.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=nopatch",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:coverage",
]